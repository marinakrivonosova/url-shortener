services:
  url-shortener:
    build: .
    image: url_shortener
    ports:
      - '8080:8080'
    depends_on:
      - postgres

  frontend:
    image: nginx
    volumes:
      - './frontend:/usr/share/nginx/html'
      - './nginx/app:/etc/nginx/conf.d'
    ports:
      - "8087:80"
    environment:
      - NGINX_PORT=80

  postgres:
    image: postgres
    restart: always
    shm_size: 128mb
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - 'postgres-volume:/var/lib/postgresql'

  prometheus:
    image: prom/prometheus
    volumes:
      - './prometheus-grafana/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml'
      - 'prometheus-volume:/prometheus'
    restart: always
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana-oss
    container_name: grafana
    depends_on:
      - prometheus
    restart: always
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=grafana
    volumes:
        - './prometheus-grafana/grafana/provisioning/datasource:/etc/grafana/provisioning/datasources'
        - './prometheus-grafana/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards'
        - 'grafana-volume:/var/lib/grafana'

volumes:
  postgres-volume:
  grafana-volume:
  prometheus-volume:
